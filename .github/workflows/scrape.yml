name: Scrape dealer stock

on:
  schedule:
    - cron: "17 5 * * *"     # every day at 05:17 UTC
  workflow_dispatch: {}       # "Run workflow" button on the Actions tab

permissions:
  contents: write             # lets the job commit the updated data/ folder

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Scrape all dealers
        run: python -m aum_scraper run --out data --geocode

      - name: Save results
        if: always()
        run: |
          git config user.name "aum-scraper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Stock update $(date -u +%F)"
          git push
