name: Scrape dealer stock

on:
  schedule:
    - cron: "17 5 * * *"     # every day at 05:17 UTC
  workflow_dispatch:          # "Run workflow" button on the Actions tab
    inputs:
      test_dealers:
        description: "Test run only: comma-separated dealer ids. Nothing is sent to WordPress or saved; the results are attached to the run."
        required: false
        default: ""
      probe_urls:
        description: "Test run only: space-separated web addresses to fetch and attach (to see how a new dealer's site works)."
        required: false
        default: ""

permissions:
  contents: write             # lets the job commit the updated data/ folder

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Set these in Settings > Secrets and variables > Actions. Until they exist the
      # scraper still runs and saves data/, it just doesn't send anything to WordPress.
      AUM_WP_URL: ${{ vars.AUM_WP_URL || 'https://approvedusedmobility.co.uk' }}
      AUM_WP_USER: ${{ secrets.AUM_WP_USER }}
      AUM_WP_APP_PASSWORD: ${{ secrets.AUM_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      # ---- test runs: try new dealers without touching WordPress or data/
      - name: Test run
        if: ${{ inputs.test_dealers != '' || inputs.probe_urls != '' }}
        env:
          TEST_DEALERS: ${{ inputs.test_dealers }}
          PROBE_URLS: ${{ inputs.probe_urls }}
        run: |
          mkdir -p test-output
          if [ -n "$PROBE_URLS" ]; then python -m aum_scraper probe $PROBE_URLS --out test-output/probe || true; fi
          if [ -n "$TEST_DEALERS" ]; then
            cp -r data test-data
            python -m aum_scraper run --out test-data --only "$TEST_DEALERS" --save-raw test-output/raw || true
            cp test-data/listings.json test-data/health.json test-output/
          fi

      - name: Attach test results
        if: ${{ inputs.test_dealers != '' || inputs.probe_urls != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: test-output
          path: test-output
          retention-days: 7

      # The same results on a "test-results" branch (replaced each test run), for tools that can't download attachments.
      - name: Share test results on a branch
        if: ${{ inputs.test_dealers != '' || inputs.probe_urls != '' }}
        run: |
          git config user.name "aum-scraper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan test-results
          git rm -rq --cached .
          git add -f test-output
          git commit -qm "Test results from run $GITHUB_RUN_ID"
          git push -qf origin HEAD:refs/heads/test-results

      # ---- normal runs
      - name: Scrape all dealers
        id: scrape
        if: ${{ inputs.test_dealers == '' && inputs.probe_urls == '' }}
        run: python -m aum_scraper run --out data --geocode

      # Runs even if one dealer failed: WordPress only takes stock down for dealers read successfully.
      - name: Send to WordPress
        if: ${{ !cancelled() && steps.scrape.outcome != 'skipped' && env.AUM_WP_APP_PASSWORD != '' }}
        run: python -m aum_scraper push --data data

      - name: Save results
        if: ${{ always() && inputs.test_dealers == '' && inputs.probe_urls == '' }}
        run: |
          git config user.name "aum-scraper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Stock update $(date -u +%F)"
          git push
