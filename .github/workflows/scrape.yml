name: Scrape dealer stock

on:
  schedule:
    - cron: "17 5 * * *"     # every day at 05:17 UTC
  workflow_dispatch: {}       # "Run workflow" button on the Actions tab

permissions:
  contents: write             # lets the job commit the updated data/ folder

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Set these in Settings > Secrets and variables > Actions. Until they exist the
      # scraper still runs and saves data/, it just doesn't send anything to WordPress.
      AUM_WP_URL: ${{ vars.AUM_WP_URL || 'https://approvedusedmobility.co.uk' }}
      AUM_WP_USER: ${{ secrets.AUM_WP_USER }}
      AUM_WP_APP_PASSWORD: ${{ secrets.AUM_WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q

      - name: Scrape all dealers
        id: scrape
        run: python -m aum_scraper run --out data --geocode

      # Runs even if one dealer failed: WordPress only takes stock down for dealers read successfully.
      - name: Send to WordPress
        if: ${{ !cancelled() && steps.scrape.outcome != 'skipped' && env.AUM_WP_APP_PASSWORD != '' }}
        run: python -m aum_scraper push --data data

      - name: Save results
        if: always()
        run: |
          git config user.name "aum-scraper-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Stock update $(date -u +%F)"
          git push
