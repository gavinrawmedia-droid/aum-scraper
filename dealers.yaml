# Dealers the scraper collects approved-used stock from.
#
# To add a dealer: copy a block, change the details, and pick the platform:
#   shopify          - the dealer's site runs on Shopify (most do). List the used/ex-demo
#                      collection handles, or set whole_store: true and add an include rule.
#   mobility_giant   - Mobility Giant's own site (HTML listing pages).
#
# price_basis tells the site how to label prices:
#   vat_relief - the price shown is before VAT; buyers who don't qualify for VAT relief pay 20% more
#   no_vat     - the dealer says there is no VAT to add
#   check      - it varies by item; tell buyers to confirm with the dealer
#
# warranty_policy is only for a warranty the dealer states for ALL its used stock.
# The scraper prefers a warranty stated on the item itself.

defaults:
  min_price: 300          # ignore anything cheaper (accessories, spares)
  user_agent: "ApprovedUsedMobilityBot/0.1 (+https://approvedusedmobility.co.uk/about-our-listings)"
  delay_seconds: 3        # pause between requests to the same site

dealers:
  - id: active-mobility
    name: Active Mobility
    website: https://activemob.co.uk
    address: Unit 3 & 4, Avenue Fields Industrial Estate, Birmingham Rd
    town: Stratford-upon-Avon
    postcode: CV37 0HT
    phone: "01789 339 738"
    platform: shopify
    collections:
      - pre-owned-mobility-scooters-uk
      - pre-owned-electric-wheelchairs-uk
    price_basis: vat_relief

  - id: aspire2
    name: Aspire2 Mobility
    website: https://aspire2.co.uk
    address: 30 Pillings Rd
    town: Oakham
    postcode: LE15 6QF
    phone: "01572 755204"
    platform: shopify
    whole_store: true
    include:
      text_matches: "used|ex[- ]?demo|pre[- ]?owned|pre[- ]?loved|recondition|refurb|second[- ]hand|2nd hand|showroom model|ex[- ]showroom"
    price_basis: vat_relief

  - id: mobility-solutions
    name: Mobility Solutions
    website: https://shop.mobilitysolutions.co.uk
    address: 75 Hawthorn Street
    town: Glasgow
    postcode: G22 6HY
    phone: "0800 916 3037"
    platform: shopify
    whole_store: true
    include:
      product_type: ["Used"]      # their "Trade" items are for trade buyers only
    condition_default: Used        # the whole shop is pre-owned stock
    warranty_policy:
      months: 12
      source: "Dealer policy: 'All of our Scooters include: 12 Month Free Warranty'"
    price_basis: vat_relief

  - id: mobility-world
    name: Mobility World
    website: https://www.mobilityworld.co.uk
    address: Birds Hill
    town: Letchworth Garden City
    postcode: SG6 1HX
    phone: "01462 418478"
    other_branches:
      - "78-80 Station Road, Harrow, HA1 2RX (020 3958 4328)"
    platform: shopify
    collections:
      - approved-used-mobility-scooters
      - approved-used-power-wheelchairs-for-sale
    price_basis: vat_relief

  - id: seacroft-mobility
    name: Seacroft Mobility
    website: https://www.seacroftmobility.com
    address: Batemans Court, Croft Bank
    town: Skegness
    postcode: PE24 4SZ
    phone: "01754 882327"
    other_branches:
      - "Showrooms across Lincolnshire and Nottingham, including Wragby Road, Lincoln"
    platform: shopify
    collections:
      - all-used-products
    condition_default: Used        # everything comes from their "All Used Products" collection
    price_basis: check

  - id: mobility-giant
    name: Mobility Giant
    website: https://www.mobilitygiant.co.uk
    address: Unit 5 Connections Business Park, Vestry Trading Estate
    town: Sevenoaks
    postcode: TN14 5DF
    phone: "01732 446 488"
    platform: mobility_giant
    categories:
      - foldable-travel-mobility-scooters
      - pavement-4mph-mobility-scooters
      - road-8mph-mobility-scooters
      - all-terrain-mobility-scooters
    condition_default: Used        # they only sell used stock
    warranty_policy:
      months: 12
      source: "Dealer policy: '12 Month Fully Comprehensive Warranty included'"
    price_basis: no_vat

  # ---- added 18 Nov 2026 (shortlist "quick to add"; permission emails still to go)

  - id: mobility-station
    name: Mobility Station
    website: https://mobilitystation.co.uk
    address: 2 Old Forge Road
    town: Ferndown
    postcode: BH21 7RR
    phone: "01202 287361"
    other_branches:
      - "Heathrow: 1-2 Horton Close, West Drayton, UB7 8EB (01895 520361)"
    platform: mobility_station     # their own shop (not Shopify): see adapters/mobility_station.py
    pages:
      - /clearance                 # graded used and ex-demo stock
    price_basis: vat_relief        # shown "ex. VAT" / "No VAT"

  - id: multicare
    name: Multicare Mobility
    website: https://www.multicare.co.uk
    address: Mobility House, North Valley Road
    town: Colne
    postcode: BB8 9AG
    phone: "0808 239 6687"
    platform: shopify
    collections:
      - used-stairlifts
      - refurbished-stairlifts
    # Many pages sell a stairlift "reconditioned or new": keep only the reconditioned option.
    used_variants: "recondition|refurb|pre[- ]?used|\\bused\\b|pre[- ]?owned|second[- ]hand"
    condition_default: Reconditioned
    price_basis: check

  - id: millercare
    name: Millercare
    website: https://www.millercare.co.uk
    address: Paddock Mill, Moscow Mill Street
    town: Oswaldtwistle
    postcode: BB5 0EP
    phone: "01254 233426"
    other_branches:
      - "Showrooms across Lancashire, Greater Manchester and Cheshire, including Blackburn, Preston, Blackpool, Leyland and Southport"
    platform: shopify
    collections:
      - reconditioned-stairlifts
    condition_default: Reconditioned
    warranty_policy:
      months: 3
      source: "Dealer policy: 'All of our reconditioned stairlifts come with a 3 month warranty'"
    price_basis: vat_relief

  - id: fenetic-wellbeing
    name: Fenetic Wellbeing
    website: https://www.feneticwellbeing.com
    address: Healthcare House, Snaygill Industrial Estate, Keighley Road
    town: Skipton
    postcode: BD23 2QR
    phone: "0800 567 7618"
    visit_note: "Viewing by appointment only. Call before you visit."
    platform: shopify
    whole_store: true              # ex-demo stock is mixed in with new, so pick it out by title
    include:
      title_matches: "ex[- ]?demo|ex[- ]?display|ex[- ]?showroom|\\bdemo\\b|refurb|recondition|pre[- ]?owned|\\bused\\b"
      title_excludes: "\\bnew\\b(?!\\s*batt)"
    # Each item is listed twice, "VAT Exempt: Yes" and "No": show the VAT-relief price.
    price_variants: "VAT Exempt: Yes"
    drop_categories: ["Other"]     # sofas and other furniture
    price_basis: vat_relief
